# GAH v2 — docker-compose
#
# Default (backend only, geometry loop runs in-process):
#   docker compose up
#
# With Temporal durability (geometry loop runs in a durable workflow):
#   docker compose --profile temporal up
#
# With ForgeCAD Studio embedded:
#   FORGECAD_STUDIO_URL=http://localhost:4000 docker compose --profile studio up
#
# All three together:
#   FORGECAD_STUDIO_URL=http://localhost:4000 docker compose --profile temporal --profile studio up
#
# Frontend served at http://localhost:8001/ui/
# Temporal UI at http://localhost:8088  (temporal-ui container, --profile temporal)
# RLM log TUI: uv run fast-rlm-log $(ls -t logs/*.jsonl | head -1) --tui

services:

  # ── GAH backend (FastAPI + WebSocket + static frontend) ───────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: gah-backend:latest
    platform: linux/amd64
    container_name: gah-backend
    ports:
      - "8001:8001"
    env_file:
      - .env # GEMINI_API_KEY (required)
    environment:
      PYTHONUNBUFFERED: "1"
      BACKEND_URL: "http://localhost:8001"
      FORGECAD_STUDIO_URL: "${FORGECAD_STUDIO_URL:-}"
      # Set by temporal profile; empty = in-process fallback
      TEMPORAL_HOST: "${TEMPORAL_HOST:-}"
      TEMPORAL_TASK_QUEUE: "${TEMPORAL_TASK_QUEUE:-gah-design}"
      # Browser-facing Temporal Web UI URL for the frontend's deep-link button
      # (temporal-ui container publishes :8088). Empty = button stays disabled.
      TEMPORAL_UI_URL: "${TEMPORAL_UI_URL:-}"
    volumes:
      - ./frontend:/app/frontend  # live UI — edits show on container recreate, no image rebuild
      - ./artifacts:/app/artifacts
      - ./outputs:/app/outputs    # run artifacts (STL/STEP/renders/trace.json) persisted to host
      - ./logs:/app/logs    # RLM JSONL logs readable from host via fast-rlm-log
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8001/health" ]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  # ── Dev override: live source mounts + uvicorn --reload ───────────────────
  # Usage: docker compose --profile dev up
  # Source dirs are bind-mounted over the image's COPY'd layers so any file
  # change on the host is visible inside the container immediately.
  # uvicorn --reload picks up Python changes without a restart.
  # Skills / KB .md files are read from disk at request time — also live.
  # Only rebuild the image when pyproject.toml or uv.lock changes.
  backend-dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: gah-backend:latest
    platform: linux/amd64
    container_name: gah-backend
    profiles:
      - dev
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      BACKEND_URL: "http://localhost:8001"
      FORGECAD_STUDIO_URL: "${FORGECAD_STUDIO_URL:-}"
      TEMPORAL_HOST: "${TEMPORAL_HOST:-}"
      TEMPORAL_TASK_QUEUE: "${TEMPORAL_TASK_QUEUE:-gah-design}"
      TEMPORAL_UI_URL: "${TEMPORAL_UI_URL:-}"
    volumes:
      # live source — overrides what was COPY'd into the image
      - ./backend:/app/backend
      - ./runtime:/app/runtime
      - ./rlm:/app/rlm
      - ./tools:/app/tools
      - ./primitives:/app/primitives
      - ./skills:/app/skills
      - ./KB:/app/KB
      - ./temporal:/app/temporal
      - ./frontend:/app/frontend
      # runtime artifacts (same as prod)
      - ./artifacts:/app/artifacts
      - ./outputs:/app/outputs
      - ./logs:/app/logs
    command: >
      uv run uvicorn backend.server:app
        --host 0.0.0.0 --port 8001 --workers 1 --reload
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8001/health" ]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  # ── Temporal Database (Postgres) ──────────────────────────────────────────
  temporal-db:
    image: postgres:14-alpine
    container_name: gah-temporal-db
    profiles:
      - temporal
    environment:
      - POSTGRES_USER=temporal
      - POSTGRES_PASSWORD=temporal
    volumes:
      - temporal-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Temporal server (opt-in via --profile temporal) ───────────────────────
  #
  # Single-node auto-setup with Postgres (only DB the image supports).
  # Exposes gRPC on :7233. Web UI is a SEPARATE temporalio/ui container on :8088.
  temporal:
    image: temporalio/auto-setup:1.25
    platform: linux/amd64
    container_name: gah-temporal
    profiles:
      - temporal
    ports:
      - "7233:7233"   # gRPC — Temporal SDK connects here
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-db
      - SKIP_DEFAULT_NAMESPACE_CREATION=false
    depends_on:
      temporal-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      retries: 1

  # ── Temporal Web UI (opt-in via --profile temporal) ──────────────────────
  #
  # The auto-setup image only runs the Temporal server.
  # The Web UI is a separate container that connects via gRPC to :7233.
  temporal-ui:
    image: temporalio/ui:latest
    platform: linux/amd64
    container_name: gah-temporal-ui
    profiles:
      - temporal
    ports:
      - "8088:8080"   # expose 8080 inside as 8088 on host
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:8088
    depends_on:
      temporal:
        condition: service_healthy
    restart: unless-stopped

  # ── GAH Temporal worker (opt-in via --profile temporal) ───────────────────
  #
  # Polls the 'design' task queue and executes the geometry pipeline activities.
  # Shares the same image as the backend (same Python environment).
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: gah-backend:latest
    platform: linux/amd64
    container_name: gah-worker
    profiles:
      - temporal
    command: [ "uv", "run", "python", "-m", "temporal.worker" ]
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      TEMPORAL_HOST: "temporal:7233"
      TEMPORAL_TASK_QUEUE: "${TEMPORAL_TASK_QUEUE:-gah-design}"
      # The worker-side replanner's pull tools HTTP the backend; reach it by the
      # compose service name, NOT localhost (which is the worker itself).
      BACKEND_URL: "http://backend:8001"
    volumes:
      - ./artifacts:/app/artifacts
      - ./outputs:/app/outputs    # run artifacts (STL/STEP/renders/trace.json) persisted to host
      - ./logs:/app/logs    # RLM JSONL logs readable from host via fast-rlm-log
    depends_on:
      temporal:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      disable: true

  # ── ForgeCAD Studio (opt-in via --profile studio) ─────────────────────────
  forgecad-studio:
    image: node:20-slim
    container_name: gah-forgecad
    profiles:
      - studio
    working_dir: /workspace
    command: >
      sh -c "npm install -g forgecad --prefer-offline --no-audit &&
             forgecad studio /workspace --port 4000 --host 0.0.0.0"
    ports:
      - "4000:4000"
    volumes:
      - ./artifacts/forgecad:/workspace
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://localhost:4000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))" ]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5

volumes:
  temporal-data:
