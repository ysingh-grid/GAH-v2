[project]
name = "gah-v2"
version = "0.1.0"
description = "Generative AI-powered hardware design and modeling system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "cadquery>=2.7.0",
    "deno>=2.8.3",
    "fast-rlm>=0.1.18",
    "fastapi>=0.137.2",
    "google-genai>=2.9.0",
    "matplotlib>=3.11.0",
    "meshlib>=3.1.2.192",
    "numpy>=1.26",
    "pydantic>=2.0",
    "pytest>=9.1.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "temporalio>=1.29.0",
    "uvicorn[standard]>=0.49.0",
    "vtk>=9.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "mypy>=1.7",
    "ruff>=0.1.8",
]


[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "S", "B", "A", "C4", "T20"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use bare asserts (S101) and don't need type annotations (ANN).
"tests/**" = ["S101", "ANN"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-x --tb=short --strict-markers"
markers = [
    "asyncio: marks tests as async (deselect with '-m \"not asyncio\"')",
    "anyio: marks tests as async via anyio",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*/migrations/*", "*/__init__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
