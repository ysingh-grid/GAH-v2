<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GAH — Text-to-CAD</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Navigation Bar (Glassmorphic) -->
  <div class="ga-nav">
    <a class="ga-nav-btn" href="#" onclick="window.__gah.reset(); return false;">New run</a>
    <a class="ga-nav-btn" href="#" onclick="window.__gah.showView('runs'); return false;">Runs</a>
    <a class="ga-nav-btn" href="#" onclick="window.__gah.showView('analytics'); return false;">Analytics</a>
    <a class="ga-nav-btn" href="#" id="ga-temporal-link" onclick="window.__gah.openTemporal(); return false;">
      <span id="ga-temporal-dot" class="ga-status-dot ga-dot-unknown"></span> Temporal ↗
    </a>
    <span class="ga-spacer"></span>
    <a class="ga-nav-btn ga-handoff-btn" href="#" id="ga-handoff-link" onclick="window.__gah.openForgeCAD(); return false;">
      <span id="ga-forgecad-dot" class="ga-status-dot ga-dot-unknown"></span> 🚀 Open in ForgeCAD Studio ↗
    </a>
  </div>

  <!-- Full-viewport main area -->
  <div id="ga-main">

    <!-- ForgeCAD Studio iframe (visible on success) -->
    <div id="ga-studio-view" class="ga-view" style="display:none; padding: 0;">
      <iframe
        id="ga-iframe"
        src="about:blank"
        title="ForgeCAD Studio"
        sandbox="allow-scripts allow-same-origin allow-forms"
        style="width:100%;height:100%;border:none;"
      ></iframe>
    </div>

    <!-- Form View -->
    <div id="ga-form-view" class="ga-view">
      <div class="ga-form-container">
        <h2>Design prompt</h2>
        <textarea id="ga-input" placeholder="e.g. design a centrifugal compressor impeller" aria-label="Design prompt"></textarea>
        
        <h2>Reference image (optional)</h2>
        <div class="ga-file-upload">
          <button class="ga-btn-secondary" onclick="document.getElementById('ga-file').click()">Choose file</button>
          <span id="ga-file-name">No file chosen</span>
          <input type="file" id="ga-file" style="display:none;" accept="image/*" onchange="document.getElementById('ga-file-name').textContent = this.files[0] ? this.files[0].name : 'No file chosen'">
        </div>
        
        <div class="ga-form-actions">
          <button id="ga-send" class="ga-btn-primary" onclick="window.__gah.send()">Get clarifying questions →</button>
        </div>

        <!-- Assistant Questions / Progress UI injected here -->
        <div id="ga-assistant-area"></div>
      </div>
    </div>

    <!-- Runs View -->
    <div id="ga-runs-view" class="ga-view" style="display: none;">
      <div class="ga-container">
        <h1>Run History</h1>
        <div class="ga-table-container">
          <table class="ga-table" id="ga-runs-table">
            <thead>
              <tr>
                <th>Run ID</th>
                <th>Date</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
              <!-- Populated by JS -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Analytics View -->
    <div id="ga-analytics-view" class="ga-view" style="display: none;">
      <div class="ga-container">
        <h1>Analytics Dashboard</h1>
        <div class="ga-metric-cards" id="ga-analytics-cards">
          <!-- Populated by JS -->
        </div>
      </div>
    </div>

    <!-- Service Unavailable View (shown when user clicks a dead link) -->
    <div id="ga-unavailable-view" class="ga-view" style="display: none;">
      <div class="ga-container" style="text-align:center;">
        <div style="font-size:48px; margin-bottom:16px;" id="ga-unavail-icon">🔌</div>
        <h1 id="ga-unavail-title">Service Not Running</h1>
        <p id="ga-unavail-msg" style="color:var(--fa-text2); margin:16px 0 24px; line-height:1.6;"></p>
        <button class="ga-btn-primary" onclick="window.__gah.showView('form'); return false;">← Back to Design</button>
      </div>
    </div>

  </div><!-- #ga-main -->

  <script src="app.js"></script>
</body>
</html>
